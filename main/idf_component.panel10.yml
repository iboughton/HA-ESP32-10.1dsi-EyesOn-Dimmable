#
# Manifest for the 10.1" 1280x800 panel variant (Waveshare ESP32-P4 Nano).
# Selected automatically by the top-level CMakeLists.txt based on the active
# SDKCONFIG_DEFAULTS overlay. Do NOT edit main/idf_component.yml directly --
# it is regenerated from this file on every configure.
dependencies:
  idf: ">=5.5"
  espressif/cjson:
    version: "^1.7.19"
  espressif/usb:
    version: "^1.0.0"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/ip101:
    version: "^1.1.0"
    rules:
      - if: "target in [esp32p4]"
  lvgl/lvgl:
    version: "~9.4.0"
  waveshare/esp_lcd_jd9365:
    version: "^2.0.0"
    override_path: "../components/esp_lcd_jd9365"
  # Local copy of 0.6.4 with a fix for a frame-buffer release race that can
  # deadlock the LVGL task in rotated partial mode (see display_bridge_common.c).
  espressif/esp_lvgl_adapter:
    version: "0.6.4"
    override_path: "../components/esp_lvgl_adapter"
  waveshare/esp32_p4_nano:
    version: "^3.0.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "^1.2.0"
    rules:
      - if: "target in [esp32p4]"
  joltwallet/littlefs:
    version: "^1.20.2"
  espressif/esp_hosted:
    version: "2.11.7"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "*"
