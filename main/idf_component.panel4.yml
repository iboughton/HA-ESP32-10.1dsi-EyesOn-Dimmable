#
# Manifest for the 4" 720x720 panel variant (smart86 original hardware).
# Selected automatically by the top-level CMakeLists.txt based on the active
# SDKCONFIG_DEFAULTS overlay. Do NOT edit main/idf_component.yml directly --
# it is regenerated from this file on every configure.
dependencies:
  idf: ">=5.5"
  espressif/cjson:
    version: "^1.7.19"
  espressif/usb:
    version: "^1.0.0"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  lvgl/lvgl:
    # Same LVGL as panel10. 9.6 adds a deprecation #warning for
    # LV_ASSERT_HANDLER_INCLUDE that -Werror turns into a build failure.
    version: "~9.4.0"
  waveshare/esp32_p4_wifi6_touch_lcd_4b:
    version: "^1.0.1"
    # Local copy of 1.0.4 with the ESP-IDF 6 peripheral driver components added to REQUIRES.
    override_path: "../vendor/esp32_p4_wifi6_touch_lcd_4b"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "^1.2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch_gt911:
    version: "1.2.0~2"
    rules:
      - if: "target in [esp32p4]"
  joltwallet/littlefs:
    version: "^1.20.2"
  espressif/esp_hosted:
    version: "2.11.7"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "*"
